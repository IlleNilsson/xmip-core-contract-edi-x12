[package]
name = "xmip-core-contract-edi-x12"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-contract-edi-x12"
description = "ASC X12 content contract: a sound interchange always, of a bound transaction set and version when a Location names one. A xmip-core-contract technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# contract::ContractFactory (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
# The one segment walk (`message::segment`), which the X12 shape sections
# by too: the syntax hands it the separators the ISA declares.
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }
# The shape of the same standard, whose reader of the `ISA` is the one
# (`delimiters`): a contract technology depends on the shape of its own
# standard and on no other technology (ADR-0044, amendment 2026-11-15).
shape = { package = "xmip-core-message-edi-x12", git = "https://github.com/IlleNilsson/xmip-core-message-edi-x12", branch = "main" }

[dev-dependencies]
# The parent's Stream fixture, for the tests only (ADR-0044).
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
